<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Số May Mắn Của Bạn</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --bg-color: #f4f4f4;
            --tease-color: #f39c12;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 400px;
        }
        h1 { color: #333; font-size: 1.5rem; }
        .number-display {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
            padding: 10px;
            border: 4px dashed var(--primary-color);
            border-radius: 15px;
        }
        p { color: #666; line-height: 1.5; }
        .tease-message {
            margin-top: 15px;
            color: var(--tease-color);
            font-weight: bold;
            font-style: italic;
            display: none; /* Mặc định là ẩn */
        }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>CHÚC MỪNG BẠN!</h1>
        <p>Số may mắn để quay thưởng của bạn là:</p>
        
        <div id="lucky-number" class="number-display">...</div>
        
        <div id="tease-area" class="tease-message">
            Trai xinh gái đẹp chỉ được quét 1 lần thôi nghen :3
        </div>
        
        <p><i>Hãy chụp màn hình lại hoặc giữ trang này để đối chiếu khi quay thưởng nhé!</i></p>
        
        <div class="footer">
            Số này được cấp cố định cho thiết bị của bạn.
        </div>
    </div>

    <script>
        function handleLuckySystem() {
            const numKey = 'my_event_lucky_number';
            const countKey = 'visit_count';
            
            // 1. Xử lý số may mắn
            let luckyNumber = localStorage.getItem(numKey);
            if (!luckyNumber) {
                luckyNumber = Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem(numKey, luckyNumber);
            }
            document.getElementById('lucky-number').innerText = luckyNumber;

            // 2. Xử lý đếm số lần truy cập
            let visits = localStorage.getItem(countKey);
            if (!visits) {
                visits = 1;
            } else {
                visits = parseInt(visits) + 1;
            }
            localStorage.setItem(countKey, visits);

            // 3. Kiểm tra nếu truy cập từ lần 2 trở lên thì hiện dòng trêu chọc
            if (visits >= 2) {
                document.getElementById('tease-area').style.display = 'block';
            }
        }

        window.onload = handleLuckySystem;
    </script>
</body>
</html>
