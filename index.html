<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Số May Mắn Của Bạn</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --bg-color: #f4f4f4;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 400px;
        }
        h1 { color: #333; font-size: 1.5rem; }
        .number-display {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
            padding: 10px;
            border: 4px dashed var(--primary-color);
            border-radius: 15px;
        }
        p { color: #666; line-height: 1.5; }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>CHÚC MỪNG BẠN!</h1>
        <p>Số may mắn để quay thưởng của bạn là:</p>
        
        <div id="lucky-number" class="number-display">...</div>
        
        <p><i>Hãy chụp màn hình lại hoặc giữ trang này để đối chiếu khi quay thưởng nhé!</i></p>
        
        <div class="footer">
            Số này được cấp cố định cho thiết bị của bạn.
        </div>
    </div>

    <script>
        // Hàm kiểm tra và cấp số
        function getLuckyNumber() {
            const storageKey = 'my_event_lucky_number';
            let luckyNumber = localStorage.getItem(storageKey);

            if (!luckyNumber) {
                // Nếu chưa có số, tạo số ngẫu nhiên từ 1000 đến 9999
                // Bạn có thể thay đổi phạm vi số ở đây
                luckyNumber = Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem(storageKey, luckyNumber);
            }

            document.getElementById('lucky-number').innerText = luckyNumber;
        }

        // Chạy hàm khi trang web tải xong
        window.onload = getLuckyNumber;
    </script>
</body>
</html>
